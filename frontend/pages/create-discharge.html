<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Discharge</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="topbar"><strong>Hospital Discharge System</strong><nav><a href="dashboard.html">Dashboard</a><a href="notifications.html">Notifications</a></nav></header><main class="container page-layout"><div class="page-heading"><div><p class="eyebrow">New record</p><h1>Create discharge</h1></div></div><section class="panel"><h2>Prescription auto-fill</h2><p>Upload a doctor prescription from storage or camera to extract patient details automatically.</p><form id="ocr-form" data-mode="autofill" class="form-stack" enctype="multipart/form-data"><label>Prescription photo<input name="prescription" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" capture="environment" required></label><button class="btn" type="submit">Extract patient details</button><p class="form-error" data-ocr-error role="alert"></p><p data-ocr-result></p></form></section><section class="panel"><form id="create-form" class="form-grid"><label>Patient name<input name="patientName" required></label><label>Age<input name="patientAge" type="number" min="0" max="150" required></label><label>Existing MRN<input name="patientMRN"></label><label>Disease<input name="patientDisease" required></label><label class="span-2">Test details<textarea name="testDetails" required></textarea></label><label>Admission date<input name="admissionDate" type="date"></label><label>Discharge date<input name="dischargeDate" type="date"></label><label class="span-2">Diagnosis<input name="diagnosis" required></label><label class="span-2">Treatment<textarea name="treatment"></textarea></label><label class="span-2">Discharge instructions<textarea name="dischargeInstructions"></textarea></label><div class="span-2"><button class="btn btn-primary" type="submit">Save draft</button><p class="form-error" data-error role="alert"></p></div></form></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/discharge.js"></script><script src="../js/ocr.js"></script><script>document.querySelector('#create-form').addEventListener('submit', createDischarge);</script></body></html>
