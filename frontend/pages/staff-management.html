<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Staff | Hospital Discharge System</title><link rel="stylesheet" href="../css/style.css"></head>
<body onload="loadPendingStaff()"><header class="topbar"><strong>Hospital Discharge System</strong><nav><a href="dashboard.html">Dashboard</a><a href="notifications.html">Notifications</a></nav></header><main class="container page-layout"><div class="page-heading"><div><p class="eyebrow">Admin access</p><h1>Staff management</h1><p>Create accounts or review signup requests.</p></div></div><section class="panel"><h2>Create staff account</h2><form id="staff-form" class="form-grid"><label>Staff ID<input name="staffId" required></label><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Department<input name="department" required></label><label>Password<input name="password" type="password" required minlength="8"></label><label>Role<select name="role"><option>Doctor</option><option>Nurse</option><option>Admin</option></select></label><div class="span-2"><button class="btn btn-primary" type="submit">Create staff</button><p class="form-error" data-error role="alert"></p><p data-success></p></div></form></section><section class="panel mt-3"><h2>Pending signup requests</h2><div data-pending></div></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>async function loadPendingStaff(){if(!requireAuthentication())return;try{const payload=await apiRequest('/auth/staff/pending');document.querySelector('[data-pending]').innerHTML=payload.staff.map(staff=>`<p>${staff.name} · ${staff.role} · ${staff.department} <button class="btn btn-small" onclick="reviewStaff('${staff.id}','approve')">Approve</button> <button class="btn btn-small btn-danger" onclick="reviewStaff('${staff.id}','reject')">Reject</button></p>`).join('')||'<p>No pending requests.</p>';}catch(error){document.querySelector('[data-pending]').textContent=error.message;}}async function reviewStaff(id,action){await apiRequest(`/auth/staff/${encodeURIComponent(id)}/${action}`,{method:'POST'});loadPendingStaff();}document.querySelector('#staff-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;try{await apiRequest('/auth/staff',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});document.querySelector('[data-success]').textContent='Staff account created.';form.reset();}catch(error){document.querySelector('[data-error]').textContent=error.message;}});</script></body></html>
