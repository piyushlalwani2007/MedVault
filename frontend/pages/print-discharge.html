<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Print Discharge</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="container page-layout"><section class="panel"><p class="eyebrow">Approved discharge</p><h1>Print discharge</h1><div data-record></div><img data-qr alt="Discharge QR code"><button class="btn btn-primary" onclick="window.print()">Print</button></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>async function loadPrint(){if(!requireAuthentication())return;const id=new URLSearchParams(location.search).get('id');if(!id)return;const record=await apiRequest(`/discharge/${encodeURIComponent(id)}`);const qr=await apiRequest(`/discharge/${encodeURIComponent(id)}/qr`);const patient=record.patient;document.querySelector('[data-record]').innerHTML=`<p><strong>Hospital:</strong> ${document.title.split(' | ')[0]}</p><p><strong>Name:</strong> ${patient.name}</p><p><strong>Age:</strong> ${patient.age}</p><p><strong>Test reports:</strong> ${patient.testDetails}</p><p><strong>Prescribed medicine:</strong> ${record.prescriptions.flatMap(item => item.medicines || []).map(item => item.name).join(', ') || 'None'}</p><p><strong>Disease:</strong> ${patient.disease}</p>`;document.querySelector('[data-qr]').src=qr.qrCode;}loadPrint();</script></body></html>
