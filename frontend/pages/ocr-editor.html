<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Discharge Editor</title><link rel="stylesheet" href="../css/style.css"></head>
<body onload="loadEditor().catch(error => { document.querySelector('[data-editor-error]').textContent = error.message; })"><header class="topbar"><strong>Hospital Discharge System</strong><nav><a href="dashboard.html">Dashboard</a><a data-print href="print-discharge.html">Printing</a><a href="notifications.html">Notifications</a></nav></header><main class="container page-layout"><div class="page-heading"><div><p class="eyebrow">Review</p><h1>Discharge <span data-discharge-id></span></h1><p>Status: <strong data-status></strong></p><p class="form-error" data-editor-error role="alert"></p></div></div><section class="panel"><form id="editor-form" class="form-grid"><label>Admission date<input name="admissionDate" type="date"></label><label>Discharge date<input name="dischargeDate" type="date"></label><label class="span-2">Diagnosis<input name="diagnosis" required></label><label class="span-2">Treatment<textarea name="treatment"></textarea></label><label class="span-2">Discharge instructions<textarea name="dischargeInstructions"></textarea></label><div class="span-2 actions"><button class="btn" data-action data-draft-action data-save onclick="saveDischarge().catch(error => { document.querySelector('[data-editor-error]').textContent = error.message; })" type="button">Save changes</button><button class="btn btn-primary" data-action data-draft-action data-approve onclick="changeDischargeState('approve').catch(error => { document.querySelector('[data-editor-error]').textContent = error.message; })" type="button">Approve</button><button class="btn btn-danger" data-action data-draft-action data-cancel onclick="changeDischargeState('cancel').catch(error => { document.querySelector('[data-editor-error]').textContent = error.message; })" type="button">Reject / cancel</button></div></form></section><section class="panel mt-3"><h2>Prescription OCR</h2><p>Upload a prescription image from storage or use your camera, then review the extracted medicines before verification.</p><form id="ocr-form" class="form-stack" enctype="multipart/form-data"><input type="hidden" name="dischargeId"><label>Prescription image<input name="prescription" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" capture="environment" required></label><button class="btn" type="submit">Extract with Google Vision</button></form><p class="form-error" data-ocr-error role="alert"></p><p data-ocr-result></p><div data-prescription class="stack"></div></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/ocr.js"></script><script src="../js/discharge.js"></script><script>document.querySelector('#ocr-form').addEventListener('submit', uploadPrescription); const dischargeId = new URLSearchParams(location.search).get('id'); document.querySelector('[name="dischargeId"]').value = dischargeId || '';</script></body></html>
