<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In | MedVault</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      background: radial-gradient(circle at 10% 10%, #eef7f4 0%, #f6faf8 45%, #e8f3f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(19, 111, 99, 0.12);
      border-radius: 22px;
      padding: 36px 34px;
      box-shadow: 0 20px 60px rgba(12, 88, 80, 0.10), 0 4px 16px rgba(0, 0, 0, 0.03);
      backdrop-filter: blur(16px);
      animation: fadeInUp 0.4s ease-out;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line-soft, #e9efed);
    }
    .auth-brand-icon {
      font-size: 26px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #e3f1ee 0%, #cde8e2 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(19, 111, 99, 0.12);
    }
    .auth-brand-text h2 {
      margin: 0;
      font-size: 20px;
      font-family: var(--font-display, Georgia, serif);
      color: #0c5850;
      letter-spacing: -0.3px;
    }
    .auth-brand-text p {
      margin: 0;
      font-size: 11px;
      color: #637571;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #243532;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1.5px solid var(--line, #dbe4e1);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      background: #ffffff;
      transition: all 0.2s ease;
      color: var(--ink);
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--brand, #136f63);
      box-shadow: 0 0 0 3px rgba(19, 111, 99, 0.15);
    }
    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 16px;
      color: #8b9895;
      pointer-events: none;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #718380;
      padding: 4px;
    }
    .toggle-pwd:hover { color: var(--brand); }

    .btn-submit {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #0c5850 0%, #136f63 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(12, 88, 80, 0.25);
      transition: all 0.2s ease;
      margin-top: 4px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(12, 88, 80, 0.32);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .alert-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.4;
    }
    .alert-error {
      background: #fbeae7;
      color: #b14538;
      border: 1px solid #f5c2bc;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #637571;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft, #e9efed);
    }
    .auth-footer a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">🏥</div>
      <div class="auth-brand-text">
        <h2>MedVault</h2>
        <p>Hospital Discharge Portal</p>
      </div>
    </div>

    <div style="margin-bottom:22px;">
      <h1 style="font-size:22px;margin:0 0 4px 0;color:#0e2c2a;">Staff Sign In</h1>
      <p style="margin:0;font-size:13px;color:#637571;">Access clinical discharge management & patient records.</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="staffId">Staff ID / Employee Code</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input id="staffId" name="staffId" placeholder="e.g. DOC101" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">👁️</button>
        </div>
      </div>

      <button class="btn-submit" type="submit">Sign In to Portal &rarr;</button>

      <div class="alert-banner alert-error" data-error role="alert"></div>
    </form>

    <div class="auth-footer">
      <span>New medical staff member?</span>
      <a href="staff-signup.html">Create an account</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (field) {
        const isPwd = field.type === 'password';
        field.type = isPwd ? 'text' : 'password';
        btn.textContent = isPwd ? '🙈' : '👁️';
      }
    }
  </script>
</body>
</html>
