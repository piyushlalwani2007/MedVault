<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Hospital Discharge System</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="container auth-layout"><section class="panel auth-panel"><p class="eyebrow">Hospital Discharge System</p><h1>Staff login</h1><p>Manage patient discharge records and approvals.</p><form id="login-form" class="form-stack"><label>Staff ID<input name="staffId" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Sign in</button><p class="form-error" data-error role="alert"></p></form><p class="mt-2"><a href="staff-signup.html">Sign up as staff</a></p></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>document.querySelector('#login-form').addEventListener('submit', handleLogin);</script></body></html>
